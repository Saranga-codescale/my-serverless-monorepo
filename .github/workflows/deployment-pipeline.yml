name: Deploy Serverless Application

on:
  push:
    branches:
      - prod # Deploy to production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NX_CLOUD_ACCESS_TOKEN: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Dependencies
        run: npm install

      - name: Build Lambda Functions
        run: npx nx run-many --target=build --all

      - name: Generate SAM Template
        run: |
          cat > template.yaml << EOF
          AWSTemplateFormatVersion: '2010-09-09'
          Transform: AWS::Serverless-2016-10-31

          Parameters:
            UsersTable:
              Type: String
              Default: ${{ vars.USERS_TABLE_STG }}

          Globals:
            Function:
              Runtime: nodejs22.x
              Environment:
                Variables:
                  USERS_TABLE: !Ref UsersTable
              Role: ${{ vars.AWS_LAMBDA_ROLE_ARN }}

          Resources:
          EOF

          # Generate function resources dynamically
          for function in $(ls dist/lambda); do
            cat >> template.yaml << EOF
            ${function^}Function:
              Type: AWS::Serverless::Function
              Properties:
                FunctionName: !Sub '\${AWS::StackName}-$function'
                CodeUri: dist/lambda/$function/
                Handler: index.handler

          EOF
          done

      - name: Deploy Stack
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          sam deploy \
            --stack-name "<namespace>-api-stg" \
            --s3-bucket ${{ vars.DEPLOYMENT_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
