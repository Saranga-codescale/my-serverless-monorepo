name: Deploy Serverless Application

on:
  push:
    branches:
      - prod # Deploy to production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Dependencies
        run: npm install

      - name: Build Lambda Functions
        run: npx nx run-many --target=build --all

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "namespace=my-serverless-monorepo" >> $GITHUB_OUTPUT
          fi

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        env:
          AWS_REGION: us-east-1 # Set your default region
        run: |
          # Create S3 bucket for SAM deployment if it doesn't exist
          BUCKET_NAME="${{ steps.env.outputs.namespace }}-sam-deployment-${{ steps.env.outputs.environment }}"
          aws s3 mb s3://$BUCKET_NAME --region $AWS_REGION 2>/dev/null || true

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ steps.env.outputs.namespace }}-${{ steps.env.outputs.environment }} \
            --s3-bucket $BUCKET_NAME \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region $AWS_REGION \
            --parameter-overrides \
              Environment=${{ steps.env.outputs.environment }} \
              Namespace=${{ steps.env.outputs.namespace }} \
              EnvType=prod \
              StageName=prod \
              awsAKey=${{ secrets.AWS_ACCESS_KEY_ID }} \
              awsSKey=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
